<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台 · d.aozio.cn</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:#f5f5f5; color:#333; min-height:100vh; }
.login-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; }
.login-box { background:#fff; padding:40px; border-radius:12px; width:360px; text-align:center; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
.login-box h1 { font-size:20px; margin-bottom:8px; color:#111; }
.login-tip { font-size:13px; color:#999; margin-bottom:20px; }
.login-tip b { color:#666; }
.login-box input { width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:14px; margin-bottom:12px; outline:none; }
.login-box input:focus { border-color:#999; }
.login-box button { width:100%; padding:12px; background:#111; color:#fff; border:none; border-radius:8px; font-size:14px; cursor:pointer; }
.login-box button:hover { background:#333; }
.login-err { color:#e74c3c; font-size:13px; margin-top:8px; display:none; }
.dashboard { display:none; max-width:960px; margin:0 auto; padding:30px 20px; }
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.header h1 { font-size:20px; color:#111; }
.logout { font-size:13px; color:#999; cursor:pointer; }
.stats { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }
.stat-card { background:#fff; padding:20px; border-radius:12px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,0.05); }
.stat-num { font-size:32px; font-weight:700; color:#111; }
.stat-label { font-size:13px; color:#999; margin-top:4px; }
.search-bar { margin-bottom:16px; }
.search-bar input { width:100%; padding:10px 14px; border:1px solid #e0e0e0; border-radius:8px; font-size:14px; outline:none; }
.search-bar input:focus { border-color:#999; }
.table-wrap { background:#fff; border-radius:12px; overflow-x:auto; box-shadow:0 1px 4px rgba(0,0,0,0.05); }
table { width:100%; border-collapse:collapse; min-width:700px; }
th { background:#fafafa; text-align:left; padding:12px 14px; font-size:12px; color:#999; font-weight:500; border-bottom:1px solid #f0f0f0; white-space:nowrap; }
td { padding:12px 14px; font-size:13px; border-bottom:1px solid #f5f5f5; vertical-align:top; }
tr:last-child td { border-bottom:none; }
.short-link { color:#111; font-weight:500; cursor:pointer; white-space:nowrap; }
.short-link:hover { text-decoration:underline; }
.orig-url { color:#666; word-break:break-all; max-width:260px; }
.orig-url .ellipsis { cursor:pointer; color:#999; }
.orig-url .full { display:none; cursor:pointer; }
.orig-url.expanded .ellipsis { display:none; }
.orig-url.expanded .full { display:inline; }
.time { color:#999; font-size:12px; white-space:nowrap; }
.ip { color:#999; font-size:12px; white-space:nowrap; }
.pagination { display:flex; justify-content:center; align-items:center; gap:12px; margin-top:16px; font-size:13px; color:#666; }
.pagination button { padding:6px 14px; border:1px solid #ddd; background:#fff; border-radius:6px; cursor:pointer; font-size:13px; }
.pagination button:disabled { opacity:0.4; cursor:not-allowed; }
.empty { text-align:center; padding:40px; color:#bbb; font-size:14px; }
.loading { text-align:center; padding:40px; color:#999; font-size:14px; }
</style>
</head>
<body>

<div class="login-wrap" id="loginView">
  <div class="login-box">
    <h1>后台管理</h1>
    <p class="login-tip">访问密码：<b>admin</b></p>
    <input type="password" id="pwd" placeholder="请输入访问密码" autofocus>
    <button onclick="login()">登录</button>
    <div class="login-err" id="loginErr">密码错误</div>
  </div>
</div>

<div class="dashboard" id="dashView">
  <div class="header">
    <h1>短链后台</h1>
    <span class="logout" onclick="logout()">退出</span>
  </div>
  <div class="stats">
    <div class="stat-card"><div class="stat-num" id="totalNum">-</div><div class="stat-label">总短链</div></div>
    <div class="stat-card"><div class="stat-num" id="todayNum">-</div><div class="stat-label">今日短链</div></div>
  </div>
  <div class="search-bar"><input type="text" id="searchInput" placeholder="搜索：IP / 短链 / 原链接" oninput="renderPage()"></div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>时间</th><th>IP</th><th>短链</th><th>原链接</th></tr></thead>
      <tbody id="linkList"></tbody>
    </table>
  </div>
  <div class="pagination">
    <button id="prevBtn" onclick="changePage(-1)">上一页</button>
    <span id="pageInfo"></span>
    <button id="nextBtn" onclick="changePage(1)">下一页</button>
  </div>
  <div class="empty" id="emptyTip" style="display:none">暂无短链</div>
  <div class="loading" id="loadingTip">加载中...</div>
</div>

<script>
var GITHUB_TOKEN = "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";
var REPO_OWNER = "aozio-cn";
var REPO_NAME = "d-aozio-cn";
var BASE_DOMAIN = "https://d.aozio.cn";
var PASSWORD = "admin";

var pwd = sessionStorage.getItem("admin_pwd") || "";
var allLinks = [];
var page = 1;
var pageSize = 20;

function login() {
  var p = document.getElementById("pwd").value;
  if (p === PASSWORD) {
    sessionStorage.setItem("admin_pwd", p);
    document.getElementById("loginErr").style.display = "none";
    loadData();
  } else {
    document.getElementById("loginErr").style.display = "block";
  }
}

function logout() {
  sessionStorage.removeItem("admin_pwd");
  location.reload();
}

function fmtNum(n) {
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, "") + "w";
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";
  return String(n);
}

function fmtTime(ts) {
  if (!ts) return "-";
  var d = new Date(ts);
  function pad(n) { return String(n).padStart(2, "0"); }
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function copyText(t) { navigator.clipboard.writeText(t); }

async function loadData() {
  document.getElementById("loginView").style.display = "none";
  document.getElementById("dashView").style.display = "block";
  document.getElementById("loadingTip").style.display = "block";
  document.getElementById("linkList").innerHTML = "";

  try {
    // 列出仓库根目录
    var res = await fetch("https://api.github.com/repos/" + REPO_OWNER + "/" + REPO_NAME + "/contents/", {
      headers: { "Authorization": "token " + GITHUB_TOKEN }
    });
    var items = await res.json();

    // 过滤出文件夹（type === "dir"），排除 admin
    var dirs = items.filter(function(item) {
      return item.type === "dir" && item.name !== "admin";
    });

    // 逐个读取每个文件夹的 index.html，解析 meta
    allLinks = [];
    for (var i = 0; i < dirs.length; i++) {
      var code = dirs[i].name;
      try {
        var fileRes = await fetch("https://api.github.com/repos/" + REPO_OWNER + "/" + REPO_NAME + "/contents/" + code + "/index.html", {
          headers: { "Authorization": "token " + GITHUB_TOKEN }
        });
        var fileData = await fileRes.json();
        var content = atob(fileData.content);
        var match = content.match(/<script type="application\/json" id="meta">([\s\S]*?)<\/script>/);
        if (match) {
          var meta = JSON.parse(match[1]);
          allLinks.push(meta);
        } else {
          // 兼容旧格式
          var urlMatch = content.match(/location\.href\s*=\s*["']([^"']+)["']/);
          if (urlMatch) allLinks.push({ code: code, url: urlMatch[1], time: null, ip: "" });
        }
      } catch (e) {}
    }

    // 按时间倒序
    allLinks.sort(function(a, b) { return (b.time || 0) - (a.time || 0); });

    // 统计
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var todayTs = today.getTime();
    var todayCount = allLinks.filter(function(l) { return l.time && l.time >= todayTs; }).length;

    document.getElementById("totalNum").textContent = fmtNum(allLinks.length);
    document.getElementById("todayNum").textContent = fmtNum(todayCount);
    document.getElementById("loadingTip").style.display = "none";
    page = 1;
    renderPage();
  } catch (e) {
    document.getElementById("loadingTip").textContent = "加载失败：" + e.message;
  }
}

function getFiltered() {
  var q = document.getElementById("searchInput").value.toLowerCase();
  if (!q) return allLinks;
  return allLinks.filter(function(l) {
    return l.code.toLowerCase().indexOf(q) >= 0 ||
           (l.ip || "").toLowerCase().indexOf(q) >= 0 ||
           (l.url || "").toLowerCase().indexOf(q) >= 0;
  });
}

function renderPage() {
  var filtered = getFiltered();
  var totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  if (page > totalPages) page = totalPages;
  if (page < 1) page = 1;
  var start = (page - 1) * pageSize;
  var pageData = filtered.slice(start, start + pageSize);

  var tbody = document.getElementById("linkList");
  tbody.innerHTML = "";
  document.getElementById("emptyTip").style.display = filtered.length === 0 ? "block" : "none";

  for (var i = 0; i < pageData.length; i++) {
    var l = pageData[i];
    var shortUrl = BASE_DOMAIN + "/" + l.code;
    var long = l.url || "";
    var isLong = long.length > 50;
    var tr = document.createElement("tr");
    var html = "";
    html += '<td class="time">' + fmtTime(l.time) + '</td>';
    html += '<td class="ip">' + esc(l.ip || "-") + '</td>';
    html += '<td><span class="short-link" onclick="copyText(\'' + esc(shortUrl) + '\')">' + esc(shortUrl) + '</span></td>';
    if (isLong) {
      html += '<td><span class="orig-url"><span class="ellipsis" onclick="this.parentElement.classList.add(\'expanded\')">' + esc(long.slice(0, 50)) + '… 展开</span><span class="full" onclick="copyText(\'' + esc(long) + '\')">' + esc(long) + '（点击复制）</span></span></td>';
    } else {
      html += '<td><span onclick="copyText(\'' + esc(long) + '\')" style="cursor:pointer;color:#666">' + esc(long) + '</span></td>';
    }
    tr.innerHTML = html;
    tbody.appendChild(tr);
  }

  document.getElementById("pageInfo").textContent = page + " / " + totalPages + "（共" + filtered.length + "条）";
  document.getElementById("prevBtn").disabled = page <= 1;
  document.getElementById("nextBtn").disabled = page >= totalPages;
}

function changePage(d) { page += d; renderPage(); }

// 自动登录
if (pwd === PASSWORD) {
  loadData();
} else {
  pwd = "";
  sessionStorage.removeItem("admin_pwd");
}

document.getElementById("pwd").addEventListener("keydown", function(e) {
  if (e.key === "Enter") login();
});
</script>
</body>
</html>
